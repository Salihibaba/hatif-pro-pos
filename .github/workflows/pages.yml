name: Deploy web app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Create Supabase browser config
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat > supabase-config.js <<EOF
          window.SUPABASE_CONFIG = {
            url: "${SUPABASE_URL}",
            anonKey: "${SUPABASE_ANON_KEY}"
          };
          EOF

      - name: Create auth browser config
        shell: bash
        env:
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD_HASH: ${{ secrets.APP_PASSWORD_HASH }}
        run: |
          cat > auth-config.js <<EOF
          window.PHONE_PRO_AUTH = {
            username: "${APP_USERNAME:-hamma}",
            passwordHash: "${APP_PASSWORD_HASH}"
          };
          EOF

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

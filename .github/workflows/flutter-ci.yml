name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  analyze-test-build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android and iOS scaffolds
        run: flutter create --platforms=android,ios --project-name hatif_pro .

      - name: Create Firebase defines
        run: cp firebase_defines.example.json firebase_defines.json

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release --dart-define-from-file=firebase_defines.json

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android and iOS scaffolds
        run: flutter create --platforms=android,ios --project-name hatif_pro .

      - name: Create Firebase defines
        run: cp firebase_defines.example.json firebase_defines.json

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign --dart-define-from-file=firebase_defines.json
